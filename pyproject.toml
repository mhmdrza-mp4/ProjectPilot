[project]
name = "project-decision"
version = "0.1.0"
description = "Decision-support system that helps project planners choose project-control decisions for Microsoft Project schedules."
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/project_decision"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
